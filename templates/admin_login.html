<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>Admin Login</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
        color: #222;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .login-box {
        width: 100%;
        max-width: 420px;
        background-color: white;
        padding: 35px;
        border-radius: 16px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.10);
    }

    h1 {
        text-align: center;
        margin-top: 0;
        margin-bottom: 30px;
        color: #ff6b35;
    }

    label {
        font-weight: bold;
    }

    input {
        width: 100%;
        padding: 12px;
        margin-top: 8px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 15px;
    }

    input:focus {
        outline: none;
        border-color: #ff6b35;
    }

    button {
        width: 100%;
        padding: 13px;
        margin-top: 10px;
        background-color: #ff6b35;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        background-color: #e85a2a;
    }

    .back {
        display: block;
        text-align: center;
        margin-top: 22px;
        color: #ff6b35;
        text-decoration: none;
        font-weight: bold;
    }

    .back:hover {
        text-decoration: underline;
    }
</style>
```

</head>

<body>

```
<div class="login-box">

    <h1>🔐 Admin Login</h1>

    <form action="/admin/login" method="POST">

        <label>Username:</label>

        <input
            type="text"
            name="username"
            required
        >

        <br><br>

        <label>Password:</label>

        <input
            type="password"
            name="password"
            required
        >

        <button type="submit">
            🔑 Login
        </button>

    </form>

    <a href="/" class="back">
        🏠 Back to Menu
    </a>

</div>
```

</body>

</html>
